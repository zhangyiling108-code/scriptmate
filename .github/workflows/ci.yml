name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '.[mcp,dev]'
      - name: Test full suite
        if: runner.os != 'Windows'
        run: python -m pytest tests -q
      - name: Test CLI and MCP on Windows
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_cli.py tests/test_config.py tests/test_mcp_service.py tests/test_mcp_setup.py -q
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scriptmate-distributions
          path: dist/*
